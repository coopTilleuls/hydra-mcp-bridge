# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Mcp/RestoringRegistryDecorator.php'

    # Decorate the MCP registry to lazily restore dynamic tools from persistent storage.
    # This must decorate mcp.server.default.registry (before the TraceableRegistry in debug mode).
    App\Mcp\RestoringRegistryDecorator:
        decorates: 'mcp.server.default.registry'
        decoration_priority: 10
        arguments:
            $inner: '@.inner'

    Mcp\Capability\RegistryInterface: '@mcp.server.default.registry'

    App\JsonLd\HttpClientDocumentLoader:
        arguments:
            $httpClient: '@hydra.client'

    App\JsonLd\Expander:
        arguments:
            $documentLoader: '@App\JsonLd\HttpClientDocumentLoader'
            $baseUrl: '%env(HYDRA_API_BASE_URL)%'

    App\Mcp\AffordanceStore:
        arguments:
            $sessionStore: '@mcp.server.default.session.store'

    App\Mcp\DynamicToolRegistry:
        arguments:
            $registry: '@App\Mcp\RestoringRegistryDecorator.inner'

    App\Mcp\Handler\DynamicToolRequestHandler:
        arguments:
            $hydraClient: '@hydra.client'
            $logger: '@logger'

    App\Eval\McpEvalLogger:
        arguments:
            $evalDir: '%kernel.project_dir%/var/eval'

    App\State\ReadHydraResourceProcessor:
        arguments:
            $hydraClient: '@hydra.client'

